<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Local Qwen topology validation</title>
  <style>
    body { margin: 24px; background: #fff; color: #111; font: 14px Arial, sans-serif; }
    main { max-width: 1100px; margin: auto; }
    section { border-top: 1px solid #ccc; padding: 20px 0; }
    img { width: 100%; height: auto; border: 1px solid #bbb; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Local Qwen topology validation</h1>
  <p>외부 API 없이 로컬 Qwen3-4B와 결정론적 기하 생성기로 실행한 결과입니다.</p>
  <section>
    <h2>Before / after</h2>
    <div class="grid">
      <a href="office-before-after.png"><img src="office-before-after.png" alt="Office before and after"></a>
      <a href="commercial-before-after.png"><img src="commercial-before-after.png" alt="Commercial before and after"></a>
    </div>
  </section>
  <section>
    <h2>Rectangular office: 2/2 accepted, 2 distinct</h2>
    <div class="grid">
      <img src="office-topology-1.png" alt="Office topology 1">
      <img src="office-topology-2.png" alt="Office topology 2">
    </div>
  </section>
  <section>
    <h2>L-shaped commercial: 2/2 accepted, 2 distinct</h2>
    <div class="grid">
      <img src="commercial-l-topology-1.png" alt="Commercial topology 1">
      <img src="commercial-l-topology-2.png" alt="Commercial topology 2">
    </div>
  </section>
</main>
</body>
</html>
