services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      PLANM_REPOSITORY_ROOT: /app
      PLANM_RUNS_ROOT: /data/planm-runs
    volumes:
      - planm-runs:/data/planm-runs
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  planm-runs:
