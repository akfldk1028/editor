name: mcp-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/mcp/**'
      - 'resources/lib/core/**'
      - 'frontend/app/editor/app/api/scenes/**'
      - 'frontend/app/editor/lib/scene-*'
      - 'frontend/app/editor/package.json'
      - 'bun.lock'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'backend/mcp/**'
      - 'resources/lib/core/**'
      - 'frontend/app/editor/app/api/scenes/**'
      - 'frontend/app/editor/lib/scene-*'
      - 'frontend/app/editor/package.json'
      - 'bun.lock'
      - '.github/workflows/mcp-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build core
        run: bun run --cwd resources/lib/core build

      - name: Build mcp
        run: bun run --cwd backend/mcp build

      - name: Test mcp
        run: bun test --cwd backend/mcp

      - name: Test editor scene API
        run: bun test frontend/app/editor/lib/scene-store-server.test.ts frontend/app/editor/lib/scene-api-security.test.ts

      - name: Biome check
        run: bunx biome check backend/mcp frontend/app/editor/lib/scene-store-server.ts frontend/app/editor/lib/scene-api-security.ts frontend/app/editor/app/api/scenes
