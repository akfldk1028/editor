name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Pinned to match `packageManager` in package.json. Unpinned, this floats
      # to whatever bun is latest, so a bun release can break the gate with no
      # change in the repo — and CI then disagrees with what contributors run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # PLAN was absorbed into this repository with its own toolchain, and until now
  # nothing here ran it: a change could break 976 Python tests and still show a
  # green tick.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The architectural renderer draws Korean labels with Pillow and falls back
      # to an ASCII bitmap when it cannot find a CJK face, which changes what it
      # produces and fails 19 visual-review tests. Runners ship no CJK font.
      - name: Install a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install the product package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      # PLANM stages run in the Plan Agent (agents/planm, port 8308); the backend
      # only talks to it over HTTP. Tests that need the live agent skip when
      # PLANM_AGENT_URL does not answer.
      - name: Backend tests
        run: python -m pytest -q

      - name: Dev orchestrator and structure tests
        run: bun run plan:test:dev

  cli-smoke:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke-test the packed CLI and editor runtime
        env:
          PASCAL_PORTABLE_BUILD: "1"
        run: |
          bun run build --filter editor
          cd backend/cli
          bun run build
          bun run stage-runtime
          bun run smoke-runtime
