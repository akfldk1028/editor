name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Pinned to match `packageManager` in package.json. Unpinned, this floats
      # to whatever bun is latest, so a bun release can break the gate with no
      # change in the repo — and CI then disagrees with what contributors run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # PLAN was absorbed into this repository with its own toolchain, and until now
  # nothing here ran it: a change could break 976 Python tests and still show a
  # green tick.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install the product package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Backend tests
        run: python -m pytest -q

      # The GitAgent host is built from source and lives outside the bun
      # workspace, so a fresh checkout has neither its dependencies nor a
      # dist/. The agent tests spawn it, and without both they fail on a
      # missing module rather than on anything about the agent.
      - name: Install the GitAgent runtime's dependencies
        run: npm --prefix infra/runtimes/gitagent ci

      - name: Agent runtime and PLANM agent tests
        run: bun run plan:test:agent

      - name: Dev orchestrator and structure tests
        run: bun run plan:test:dev

  cli-smoke:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke-test the packed CLI and editor runtime
        env:
          PASCAL_PORTABLE_BUILD: "1"
        run: |
          bun run build --filter editor
          cd backend/cli
          bun run build
          bun run stage-runtime
          bun run smoke-runtime
