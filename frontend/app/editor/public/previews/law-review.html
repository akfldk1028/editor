const DATA={"review":{"assessment_date":"2026-10-09","groups":[{"id":"use","label":"용도 제한"},{"id":"bcr_far","label":"건폐율·용적률"},{"id":"height_sunlight","label":"높이·일조"},{"id":"road_setback","label":"도로·이격"},{"id":"parking_landscape","label":"주차·조경"},{"id":"district","label":"지역·지구·지구단위계획"}],"items":[{"id":"use-zone","group":"use","title":"용도지역 안에서의 건축 제한","refs":[{"instrument":"국토의 계획 및 이용에 관한 법률","kind":"act","article":"제76조","clause":null,"text":"제36조에 따라 지정된 용도지역에서의 건축물이나 그 밖의 시설의 용도ㆍ종류 및 규모 등의 제한에 관한 사항은 대통령령으로 정한다.\n건축물이나 그 밖의 시설의 용도ㆍ종류 및 규모 등을 변경하는 경우 변경 후의 건축물이나 그 밖의 시설의 용도ㆍ종류 및 규모 등은 제1항과 제2항에 맞아야 한다.\n제37조에 따라 지정된 용도지구에서의 건축물이나 그 밖의 시설의 용도ㆍ종류 및 규모 등의 제한에 관한 사항은 이 법 또는 다른 법률에 특별한 규정이 있는 경우 외에는 대통령령으로 정하는 기준에 따라 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 정할 수 있다.\n보전관리지역이나 생산관리지역에 대하여 농림축산식품부장관ㆍ해양수산부장관ㆍ기후에너지환경부장관 또는 산림청장이 농지 보전, 자연환경 보전, 해양환경 보전 또는 산림 보전에 필요하다고 인정하는 경우에는 「농지법」, 「자연환경보전법」, 「야생생물 보호 및 관리에 관한 법률」, 「해양생태계의 보전 및 관리에 관한 법률」 또는 「산림자원의 조성 및 관리에 관한 법률」에 따라 건축물이나 그 밖의 시설의 용도ㆍ종류 및 규모 등을 제한할 수 있다. 이 경우 이 법에 따른 제한의 취지와 형평을 이루도록 하여야 한다.\n제1항과 제2항에 따른 건축물이나 그 밖의 시설의 용도ㆍ종류 및 규모 등의 제한은 해당 용도지역과 용도지구의 지정목적에 적합하여야 한다.\n다음 각 호의 어느 하나에 해당하는 경우의 건축물이나 그 밖의 시설의 용도ㆍ종류 및 규모 등의 제한에 관하여는 제1항부터 제4항까지의 규정에도 불구하고 각 호에서 정하는 바에 따른다.","hang_ids":["국토의 계획 및 이용에 관한 법률(법률)::제6장::제76조::1","국토의 계획 및 이용에 관한 법률(법률)::제6장::제76조::4","국토의 계획 및 이용에 관한 법률(법률)::제6장::제76조::2","국토의 계획 및 이용에 관한 법률(법률)::제6장::제76조::6","국토의 계획 및 이용에 관한 법률(법률)::제6장::제76조::3","국토의 계획 및 이용에 관한 법률(법률)::제6장::제76조::5"],"text_status":"found"},{"instrument":"국토의 계획 및 이용에 관한 법률 시행령","kind":"decree","article":"제71조","clause":null,"text":"법 제76조제1항에 따른 용도지역안에서의 건축물의 용도ㆍ종류 및 규모 등의 제한(이하 \"건축제한\"이라 한다)은 다음 각호와 같다.\n제1항의 규정에 의한 건축제한을 적용함에 있어서 부속건축물에 대하여는 주된 건축물에 대한 건축제한에 의한다.\n제1항에도 불구하고 「건축법 시행령」 별표 1에서 정하는 건축물 중 다음 각 호의 요건을 모두 충족하는 건축물의 종류 및 규모 등의 제한에 관하여는 해당 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 도시ㆍ군계획조례로 따로 정할 수 있다.\n법 제76조제1항에 따른 용도지역안에서의 건축물의 용도ㆍ종류 및 규모 등의 제한(이하 “건축제한”이라 한다)은 다음 각호와 같다. \u003c개정 2014. 1. 14.>\n제1항의 규정에 의한 건축제한을 적용함에 있어서 부속건축물에 대하여는 주된 건축물에 대한 건축제한에 의한","hang_ids":["국토의 계획 및 이용에 관한 법률(시행령)::제6장::제71조::1","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제71조::2","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제71조::3","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제71조::①","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제71조::②"],"text_status":"found"}],"reason":"대지가 제1종일반주거지역이라 지을 수 있는 건축물·없는 건축물이 시행령 별표로 정해져 있어요","status":"conditional","basis":"지역별 요약은 참고자료이며 요청 용도의 허용 판정이 아닙니다","value":null},{"id":"bcr-cap","group":"bcr_far","title":"건폐율 상한","refs":[{"instrument":"국토의 계획 및 이용에 관한 법률","kind":"act","article":"제77조","clause":null,"text":"삭제\n제36조에 따라 지정된 용도지역에서 건폐율의 최대한도는 관할 구역의 면적과 인구 규모, 용도지역의 특성 등을 고려하여 다음 각 호의 범위에서 대통령령으로 정하는 기준에 따라 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 정한다.\n제36조제2항에 따라 세분된 용도지역에서의 건폐율에 관한 기준은 제1항 각 호의 범위에서 대통령령으로 따로 정한다.\n다음 각 호의 어느 하나에 해당하는 지역에서의 건폐율에 관한 기준은 제1항과 제2항에도 불구하고 80퍼센트 이하의 범위에서 대통령령으로 정하는 기준에 따라 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 따로 정한다.\n다음 각 호의 어느 하나에 해당하는 경우로서 대통령령으로 정하는 경우에는 제1항에도 불구하고 대통령령으로 정하는 기준에 따라 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 건폐율을 따로 정할 수 있다.\n제36조에 따라 지정된 용도지역에서 건폐율의 최대한도는 관할 구역의 면적과 인구 규 모, 용도지역의 특성 등을 고려하여 다음 각 호의 범위에서 대통령령으로 정하는 기준에 따라 특별시ㆍ광역시ㆍ특별 자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 정한다. \u003c개정 2011. 4. 14., 2013. 7. 16., 2015. 8. 11.>","hang_ids":["국토의 계획 및 이용에 관한 법률(법률)::제6장::제77조::5","국토의 계획 및 이용에 관한 법률(법률)::제6장::제77조::1","국토의 계획 및 이용에 관한 법률(법률)::제6장::제77조::2","국토의 계획 및 이용에 관한 법률(법률)::제6장::제77조::3","국토의 계획 및 이용에 관한 법률(법률)::제6장::제77조::4","국토의 계획 및 이용에 관한 법률(법률)::제6장::제77조::①"],"text_status":"found"},{"instrument":"국토의 계획 및 이용에 관한 법률 시행령","kind":"decree","article":"제84조","clause":null,"text":"법 제77조제1항 및 제2항에 따른 건폐율은 다음 각 호의 범위에서 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 도시ㆍ군계획조례가 정하는 비율 이하로 한다.\n법 제77조3항제2호에서 \"대통령령으로 정하는 용도지역\"이란 자연녹지지역을 말한다.\n제1항의 규정에 의하여 도시ㆍ군계획조례로 용도지역별 건폐율을 정함에 있어서 필요한 경우에는 당해 지방자치단체의 관할구역을 세분하여 건폐율을 달리 정할 수 있다.\n특별시장ㆍ광역시장ㆍ특별자치시장ㆍ특별자치도지사ㆍ시장 또는 군수가 법 제77조제4항제1호에 따라 도시지역에서 토지이용의 과밀화를 방지하기 위하여 건폐율을 낮춰야 할 필요가 있다고 인정하여 당해 지방자치단체에 설치된 도시계획위원회의 심의를 거쳐 정한 구역안에서의 건축물의 경우에는 그 건폐율은 그 구역에 적용할 건폐율의 최대한도의 40퍼센트 이상의 범위에서 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 도시ㆍ군계획조례가 정하는 비율 이하로 한다.\n법 제77조제4항제2호에 따라 다음 각 호의 어느 하나에 해당하는 건축물의 경우에는 제1항에도 불구하고 그 건폐율은 다음 각 호에서 정하는 비율을 초과할 수 없다.\n제1항에도 불구하고 법 제77조제4항제3호 및 제4호에 따라 보전관리지역ㆍ생산관리지역ㆍ농림지역 또는 자연환경보전지역에 「농지법」 제32조제1항에 따라 건축할 수 있는 건축물의 건폐율은 60퍼센트 이하의 범위에서 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 도시ㆍ군계획조례로 정하는 비율 이하로 한다.\n법 제77조제3항에 따라 다음 각 호의 지역에서의 건폐율은 각 호에서 정한 범위에서 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 도시ㆍ군계획조례로 정하는 비율 이하로 한다.\n제1항에도 불구하고 법 제77조제4항제3호에 따라 생산녹지지역 또는 자연녹지지역(자연녹지지역은 도시ㆍ군계획조례로 정하는 지역으로 한정한다. 이하 이 항에서 같다)에 건축할 수 있는 다음 각 호의 건축물의 경우에 그 건폐율은 해당 생산녹지지역 또는 자연녹지지역이 위치한 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 농어업 인구 현황, 농수산물 가공ㆍ처리시설의 수급실태 등을 종합적으로 고려하여 60퍼센트 이하(자연녹지지역의 경우에는 40퍼센트 이하)의 범위에서 해당 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 도시ㆍ군계획조례로 정하는 비율 이하로 한다.","hang_ids":["국토의 계획 및 이용에 관한 법률(시행령)::제6장::제84조::1","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제84조::3","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제84조::2","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제84조::5","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제84조::6","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제84조::7","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제84조::4","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제84조::8"],"text_status":"found"},{"instrument":"의정부시 도시계획 조례","kind":"ordinance","article":"제42조","clause":null,"url":"https://www.law.go.kr/LSW/ordinInfoP.do?ordinSeq=2072835","edition_id":"2072835","effective_date":"2025-09-25","text":"제42조(용도지역안에서의 건폐율) 영 제84조제1항에 따른 용도지역안에서의 건폐율은 다음 각 호와 같다. \u003c개정 2007.2.1, 2012.6.22>1. 제1종전용주거지역 : 40퍼센트 이하2. 제2종전용주거지역 : 50퍼센트 이하3. 제1종일반주거지역 : 60퍼센트 이하4. 제2종일반주거지역 : 60퍼센트 이하5. 제3종일반주거지역 : 50퍼센트 이하6. 준주거지역 : 60퍼센트 이하7. 중심상업지역 : 80퍼센트 이하8. 일반상업지역 : 80퍼센트 이하 \u003c개정 2018.5.1.>9. 근린상업지역 : 60퍼센트 이하10. 유통상업지역 : 60퍼센트 이하11. 전용공업지역 : 70퍼센트 이하12. 일반공업지역 : 70퍼센트 이하13. 준공업지역 : 70퍼센트 이하14. 보전녹지지역 : 20퍼센트 이하15. 생산녹지지역 : 20퍼센트 이하16. 자연녹지지역 : 20퍼센트 이하","hang_ids":[],"text_status":"needs_source","text_gap":"조례 원문은 law.go.kr에서 Law Agent가 조문별로 가져와요"}],"reason":"제1종일반주거지역의 건폐율 상한은 법이 정한 범위(60% 이내)에서 의정부시 도시계획 조례로 정해요","status":"needs_check","basis":"Law Agent 한도 산정: 의정부시 도시계획 조례 제42조 — 공공주택지구·지구단위계획구역 확보 전이라 이 계획이 따로 정한 상한이 있으면 그 값이 우선해요","value":"60%"},{"id":"far-cap","group":"bcr_far","title":"용적률 상한","refs":[{"instrument":"국토의 계획 및 이용에 관한 법률","kind":"act","article":"제78조","clause":null,"text":"제36조에 따라 지정된 용도지역에서 용적률의 최대한도는 관할 구역의 면적과 인구 규모, 용도지역의 특성 등을 고려하여 다음 각 호의 범위에서 대통령령으로 정하는 기준에 따라 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 정한다.\n제36조제2항에 따라 세분된 용도지역에서의 용적률에 관한 기준은 제1항 각 호의 범위에서 대통령령으로 따로 정한다.\n제1항과 제4항에도 불구하고 제36조에 따른 도시지역(녹지지역만 해당한다), 관리지역에서는 창고 등 대통령령으로 정하는 용도의 건축물 또는 시설물은 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 정하는 높이로 규모 등을 제한할 수 있다.\n제1항에도 불구하고 건축물을 건축하려는 자가 그 대지의 일부에 「사회복지사업법」 제2조제4호에 따른 사회복지시설 중 대통령령으로 정하는 시설을 설치하여 국가 또는 지방자치단체에 기부채납하는 경우에는 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 해당 용도지역에 적용되는 용적률을 완화할 수 있다. 이 경우 용적률 완화의 허용범위, 기부채납의 기준 및 절차 등에 필요한 사항은 대통령령으로 정한다.\n제77조제3항제2호부터 제5호까지의 규정에 해당하는 지역에서의 용적률에 대한 기준은 제1항과 제2항에도 불구하고 200퍼센트 이하의 범위에서 대통령령으로 정하는 기준에 따라 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 따로 정한다.\n건축물의 주위에 공원ㆍ광장ㆍ도로ㆍ하천 등의 공지가 있거나 이를 설치하는 경우에는 제1항에도 불구하고 대통령령으로 정하는 바에 따라 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 용적률을 따로 정할 수 있다.","hang_ids":["국토의 계획 및 이용에 관한 법률(법률)::제6장::제78조::1","국토의 계획 및 이용에 관한 법률(법률)::제6장::제78조::2","국토의 계획 및 이용에 관한 법률(법률)::제6장::제78조::5","국토의 계획 및 이용에 관한 법률(법률)::제6장::제78조::6","국토의 계획 및 이용에 관한 법률(법률)::제6장::제78조::3","국토의 계획 및 이용에 관한 법률(법률)::제6장::제78조::4"],"text_status":"found"},{"instrument":"국토의 계획 및 이용에 관한 법률 시행령","kind":"decree","article":"제85조","clause":null,"text":"법 제78조제1항 및 제2항에 따른 용적률은 다음 각 호의 범위에서 관할구역의 면적, 인구규모 및 용도지역의 특성 등을 고려하여 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 도시ㆍ군계획조례가 정하는 비율을 초과할 수 없다.\n법 제78조제6항 전단에서 \"대통령령으로 정하는 시설\"이란 다음 각 호의 시설을 말한다.\n제3항의 규정은 제46조제9항 각 호의 어느 하나에 해당되는 경우에는 이를 적용하지 아니한다.\n국가나 지방자치단체는 법 제78조제6항 전단에 따라 기부 받은 사회복지시설을 제10항 각 호에 따른 시설 외의 시설로 용도변경하거나 그 주요 용도에 해당하는 부분을 분양 또는 임대할 수 없으며, 해당 시설의 면적이나 규모를 확장하여 설치장소를 변경(지방자치단체에 기부한 경우에는 그 관할 구역 내에서의 설치장소 변경을 말한다)하는 경우를 제외하고는 국가나 지방자치단체 외의 자에게 그 시설의 소유권을 이전할 수 없다.\n제1항에도 불구하고 건축물을 건축하려는 자가 법 제78조제6항 전단에 따라 그 대지의 일부에 사회복지시설을 설치하여 기부하는 경우에는 기부하는 시설의 연면적의 2배 이하의 범위에서 도시ㆍ군계획조례로 정하는 바에 따라 추가 건축을 허용할 수 있다. 다만, 해당 용적률은 다음 각 호의 기준을 초과할 수 없다.\n제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 해당 지역의 용적률을 다음 각 호의 구분에 따라 완화할 수 있다.","hang_ids":["국토의 계획 및 이용에 관한 법률(시행령)::제6장::제85조::1","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제85조::10","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제85조::4","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제85조::12","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제85조::11","국토의 계획 및 이용에 관한 법률(시행령)::제6장::제85조::3"],"text_status":"found"},{"instrument":"의정부시 도시계획 조례","kind":"ordinance","article":"제46조","clause":null,"url":"https://www.law.go.kr/LSW/ordinInfoP.do?ordinSeq=2072835","edition_id":"2072835","effective_date":"20250925","text":null,"hang_ids":[],"text_status":"needs_source","text_gap":"조례 원문은 law.go.kr에서 Law Agent가 조문별로 가져와요"}],"reason":"제1종일반주거지역의 용적률 상한은 법이 정한 범위(200% 이내)에서 의정부시 도시계획 조례로 정해요","status":"needs_check","basis":"Law Agent 한도 산정: 의정부시 도시계획 조례 제46조 — 공공주택지구·지구단위계획구역 확보 전이라 이 계획이 따로 정한 상한이 있으면 그 값이 우선해요","value":"200%"},{"id":"height","group":"height_sunlight","title":"건축물의 높이 제한","refs":[{"instrument":"건축법","kind":"act","article":"제60조","clause":null,"text":"삭제\n허가권자는 가로구역[(街路區域): 도로로 둘러싸인 일단(一團)의 지역을 말한다. 이하 같다]을 단위로 하여 대통령령으로 정하는 기준과 절차에 따라 건축물의 높이를 지정ㆍ공고할 수 있다. 다만, 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장은 가로구역의 높이를 완화하여 적용할 필요가 있다고 판단되는 대지에 대하여는 대통령령으로 정하는 바에 따라 건축위원회의 심의를 거쳐 높이를 완화하여 적용할 수 있다.\n특별시장이나 광역시장은 도시의 관리를 위하여 필요하면 제1항에 따른 가로구역별 건축물의 높이를 특별시나 광역시의 조례로 정할 수 있다.\n허가권자는 제1항 및 제2항에도 불구하고 일조(日照)ㆍ통풍 등 주변 환경 및 도시미관에 미치는 영향이 크지 않다고 인정하는 경우에는 건축위원회의 심의를 거쳐 이 법 및 다른 법률에 따른 가로구역의 높이 완화에 관한 규정을 중첩하여 적용할 수 있다.","hang_ids":["건축법(법률)::제6장::제60조::3","건축법(법률)::제6장::제60조::1","건축법(법률)::제6장::제60조::2","건축법(법률)::제6장::제60조::4"],"text_status":"found"},{"instrument":"국토의 계획 및 이용에 관한 법률 시행령","kind":"decree","article":"제80조","clause":null,"text":"특정용도제한지구안에서는 주거기능 및 교육환경을 훼손하거나 청소년 정서에 유해하다고 인정하여 도시ㆍ군계획조례가 정하는 건축물을 건축할 수 없다.","hang_ids":["국토의 계획 및 이용에 관한 법률(시행령)::제6장::제80조::본문"],"text_status":"found"}],"reason":"가로구역별 최고높이가 지정·고시됐는지에 따라 높이 상한이 정해져요","status":"needs_check","basis":"가로구역별 높이제한 적용","value":null},{"id":"sunlight","group":"height_sunlight","title":"일조 등의 확보를 위한 높이 제한","refs":[{"instrument":"건축법","kind":"act","article":"제61조","clause":"제1항","text":"전용주거지역과 일반주거지역 안에서 건축하는 건축물의 높이는 일조 등의 확보를 위하여 정북방향(正北方向)의 인접 대지경계선으로부터의 거리에 따라 대통령령으로 정하는 높이 이하로 하여야 한다.\n2층 이하로서 높이가 8미터 이하인 건축물에는 해당 지방자치단체의 조례로 정하는 바에 따라 제1항부터 제3항까지의 규정을 적용하지 아니할 수 있다.\n다음 각 호의 어느 하나에 해당하는 공동주택(일반상업지역과 중심상업지역에 건축하는 것은 제외한다)은 채광(採光) 등의 확보를 위하여 대통령령으로 정하는 높이 이하로 하여야 한다.\n다음 각 호의 어느 하나에 해당하면 제1항에도 불구하고 건축물의 높이를 정남(正南)방향의 인접 대지경계선으로부터의 거리에 따라 대통령령으로 정하는 높이 이하로 할 수 있다.","hang_ids":["건축법(법률)::제6장::제61조::1","건축법(법률)::제6장::제61조::4","건축법(법률)::제6장::제61조::2","건축법(법률)::제6장::제61조::3"],"text_status":"found"},{"instrument":"건축법 시행령","kind":"decree","article":"제86조","clause":"제1항","text":"전용주거지역이나 일반주거지역에서 건축물을 건축하는 경우에는 법 제61조제1항에 따라 건축물의 각 부분을 정북(正北) 방향으로의 인접 대지경계선으로부터 다음 각 호의 범위에서 건축조례로 정하는 거리 이상을 띄어 건축하여야 한다.","hang_ids":["건축법(시행령)::제6장::제86조::1"],"text_status":"found"}],"reason":"제1종일반주거지역(전용·일반주거지역)이라 정북방향 인접대지 경계에서 높이별로 띄워야 해요","status":"applies","basis":"H \u003c= 10m: 1.5; H > 10m: H * 0.5","value":null},{"id":"daylighting","group":"height_sunlight","title":"채광 인동간격","refs":[{"instrument":"건축법","kind":"act","article":"제61조","clause":null,"text":"전용주거지역과 일반주거지역 안에서 건축하는 건축물의 높이는 일조 등의 확보를 위하여 정북방향(正北方向)의 인접 대지경계선으로부터의 거리에 따라 대통령령으로 정하는 높이 이하로 하여야 한다.\n2층 이하로서 높이가 8미터 이하인 건축물에는 해당 지방자치단체의 조례로 정하는 바에 따라 제1항부터 제3항까지의 규정을 적용하지 아니할 수 있다.\n다음 각 호의 어느 하나에 해당하는 공동주택(일반상업지역과 중심상업지역에 건축하는 것은 제외한다)은 채광(採光) 등의 확보를 위하여 대통령령으로 정하는 높이 이하로 하여야 한다.\n다음 각 호의 어느 하나에 해당하면 제1항에도 불구하고 건축물의 높이를 정남(正南)방향의 인접 대지경계선으로부터의 거리에 따라 대통령령으로 정하는 높이 이하로 할 수 있다.","hang_ids":["건축법(법률)::제6장::제61조::1","건축법(법률)::제6장::제61조::4","건축법(법률)::제6장::제61조::2","건축법(법률)::제6장::제61조::3"],"text_status":"found"},{"instrument":"건축법 시행령","kind":"decree","article":"제86조","clause":null,"text":"전용주거지역이나 일반주거지역에서 건축물을 건축하는 경우에는 법 제61조제1항에 따라 건축물의 각 부분을 정북(正北) 방향으로의 인접 대지경계선으로부터 다음 각 호의 범위에서 건축조례로 정하는 거리 이상을 띄어 건축하여야 한다.\n다음 각 호의 어느 하나에 해당하는 경우에는 제1항을 적용하지 아니한다.\n법 제61조제3항 각 호 외의 부분에서 \"대통령령으로 정하는 높이\"란 제1항에 따른 높이의 범위에서 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장이 정하여 고시하는 높이를 말한다.\n법 제61조제2항에 따라 공동주택은 다음 각 호의 기준을 충족해야 한다. 다만, 채광을 위한 창문 등이 있는 벽면에서 직각 방향으로 인접 대지경계선까지의 수평거리가 1미터 이상으로서 건축조례로 정하는 거리 이상인 다세대주택은 제1호를 적용하지 않는다.\n제1항부터 제5항까지를 적용할 때 건축물을 건축하려는 대지와 다른 대지 사이에 다음 각 호의 시설 또는 부지가 있는 경우에는 그 반대편의 대지경계선(공동주택은 인접 대지경계선과 그 반대편 대지경계선의 중심선)을 인접 대지경계선으로 한다.\n특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장은 제4항에 따라 건축물의 높이를 고시하려면 국토교통부령으로 정하는 바에 따라 미리 해당 지역주민의 의견을 들어야 한다. 다만, 법 제61조제3항제1호부터 제6호까지의 어느 하나에 해당하는 지역인 경우로서 건축위원회의 심의를 거친 경우에는 그러하지 아니하다.\n제1항부터 제5항까지의 규정을 적용할 때 건축물(공동주택으로 한정한다)을 건축하려는 하나의 대지 사이에 제6항 각 호의 시설 또는 부지가 있는 경우에는 지방건축위원회의 심의를 거쳐 제6항 각 호의 시설 또는 부지를 기준으로 마주하고 있는 해당 대지의 경계선의 중심선을 인접 대지경계선으로 할 수 있다.","hang_ids":["건축법(시행령)::제6장::제86조::1","건축법(시행령)::제6장::제86조::2","건축법(시행령)::제6장::제86조::4","건축법(시행령)::제6장::제86조::3","건축법(시행령)::제6장::제86조::6","건축법(시행령)::제6장::제86조::5","건축법(시행령)::제6장::제86조::7"],"text_status":"found"}],"reason":"공동주택을 짓거나 한 대지에 두 동 이상이면 채광 방향 이격이 생겨요","status":"needs_check","basis":"용도·용도지역·제61조제2항 조건 확인 필요","value":null},{"id":"road-frontage","group":"road_setback","title":"접도의무","refs":[{"instrument":"건축법","kind":"act","article":"제44조","clause":null,"text":"건축물의 대지는 2미터 이상이 도로(자동차만의 통행에 사용되는 도로는 제외한다)에 접하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하면 그러하지 아니하다.\n건축물의 대지가 접하는 도로의 너비, 대지가 도로에 접하는 부분의 길이, 그 밖에 대지와 도로의 관계에 관하여 필요한 사항은 대통령령으로 정하는 바에 따른다.","hang_ids":["건축법(법률)::제4장::제44조::1","건축법(법률)::제4장::제44조::2"],"text_status":"found"}],"reason":"모든 건축물의 대지는 정해진 폭 이상 도로에 접해야 해요","status":"applies","basis":"건축물 대지는 2m 이상 도로에 접해야 함 (연면적 합계>2000m2: 6m)","value":null},{"id":"corner","group":"road_setback","title":"도로 모퉁이의 건축선(가각전제)","refs":[{"instrument":"건축법","kind":"act","article":"제46조","clause":"제1항","text":"도로와 접한 부분에 건축물을 건축할 수 있는 선[이하 \"건축선(建築線)\"이라 한다]은 대지와 도로의 경계선으로 한다. 다만, 제2조제1항제11호에 따른 소요 너비에 못 미치는 너비의 도로인 경우에는 그 중심선으로부터 그 소요 너비의 2분의 1의 수평거리만큼 물러난 선을 건축선으로 하되, 그 도로의 반대쪽에 경사지, 하천, 철도, 선로부지, 그 밖에 이와 유사한 것이 있는 경우에는 그 경사지 등이 있는 쪽의 도로경계선에서 소요 너비에 해당하는 수평거리의 선을 건축선으로 하며, 도로의 모퉁이에서는 대통령령으로 정하는 선을 건축선으로 한다.","hang_ids":["건축법(법률)::제4장::제46조::1"],"text_status":"found"},{"instrument":"건축법 시행령","kind":"decree","article":"제31조","clause":null,"text":"법 제46조제1항에 따라 너비 8미터 미만인 도로의 모퉁이에 위치한 대지의 도로모퉁이 부분의 건축선은 그 대지에 접한 도로경계선의 교차점으로부터 도로경계선에 따라 다음의 표에 따른 거리를 각각 후퇴한 두 점을 연결한 선으로 한다.\n\t\t\t\t\n\t\t\t\t\n\t\t\t\t\n\t\t\t\t                                                                            \n\t\t\t\t\n\t\t\t\t  (단위: 미터)                                                              \n\t\t\t\t\n\t\t\t\t┌──────────┬──────────────┬──────────┐\n\t\t\t\t\n\t\t\t\t│도로의 교차각       │해당 도로의 너비            │교차되는 도로의 너비│\n\t\t\t\t\n\t\t\t\t│                    ├───────┬──────┤                    │\n\t\t\t\t\n\t\t\t\t│                    │6 이상 8 미만 │4이상 6미만 │                    │\n\t\t\t\t\n\t\t\t\t├──────────┼───────┼──────┼──────────┤\n\t\t\t\t\n\t\t\t\t│90° 미만           │4             │3           │6 이상 8 미만       │\n\t\t\t\t\n\t\t\t\t│                    ├───────┼──────┼──────────┤\n\t\t\t\t\n\t\t\t\t│                    │3             │2           │4 이상 6 미만       │\n\t\t\t\t\n\t\t\t\t├──────────┼───────┼──────┼──────────┤\n\t\t\t\t\n\t\t\t\t│90° 이상 120° 미만│3             │2           │6 이상 8 미만       │\n\t\t\t\t\n\t\t\t\t│                    ├───────┼──────┼──────────┤\n\t\t\t\t\n\t\t\t\t│                    │2             │2           │4 이상 6 미만       │\n\t\t\t\t\n\t\t\t\t└──────────┴───────┴──────┴──────────┘\n특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장은 제2항에 따라 건축선을 지정하려면 미리 그 내용을 해당 지방자치단체의 공보(公報), 일간신문 또는 인터넷 홈페이지 등에 30일 이상 공고하여야 하며, 공고한 내용에 대하여 의견이 있는 자는 공고기간에 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장에게 의견을 제출(전자문서에 의한 제출을 포함한다)할 수 있다.\n특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장은 법 제46조제2항에 따라 「국토의 계획 및 이용에 관한 법률」 제36조제1항제1호에 따른 도시지역에는 4미터 이하의 범위에서 건축선을 따로 지정할 수 있다.","hang_ids":["건축법(시행령)::제4장::제31조::1","건축법(시행령)::제4장::제31조::3","건축법(시행령)::제4장::제31조::2"],"text_status":"found"}],"reason":"대지가 너비 8m 미만 도로의 모퉁이에 있으면 교차각에 따라 건축선이 물러나요","status":"conditional","basis":"8m 미만 도로 모퉁이 (교차각별 2~4m 후퇴)","value":null},{"id":"building-line","group":"road_setback","title":"건축선","refs":[{"instrument":"건축법","kind":"act","article":"제46조","clause":null,"text":"도로와 접한 부분에 건축물을 건축할 수 있는 선[이하 \"건축선(建築線)\"이라 한다]은 대지와 도로의 경계선으로 한다. 다만, 제2조제1항제11호에 따른 소요 너비에 못 미치는 너비의 도로인 경우에는 그 중심선으로부터 그 소요 너비의 2분의 1의 수평거리만큼 물러난 선을 건축선으로 하되, 그 도로의 반대쪽에 경사지, 하천, 철도, 선로부지, 그 밖에 이와 유사한 것이 있는 경우에는 그 경사지 등이 있는 쪽의 도로경계선에서 소요 너비에 해당하는 수평거리의 선을 건축선으로 하며, 도로의 모퉁이에서는 대통령령으로 정하는 선을 건축선으로 한다.\n특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장은 제2항에 따라 건축선을 지정하면 지체 없이 이를 고시하여야 한다.\n특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장은 시가지 안에서 건축물의 위치나 환경을 정비하기 위하여 필요하다고 인정하면 제1항에도 불구하고 대통령령으로 정하는 범위에서 건축선을 따로 지정할 수 있다.","hang_ids":["건축법(법률)::제4장::제46조::1","건축법(법률)::제4장::제46조::3","건축법(법률)::제4장::제46조::2"],"text_status":"found"},{"instrument":"건축법","kind":"act","article":"제47조","clause":null,"text":"건축물과 담장은 건축선의 수직면(垂直面)을 넘어서는 아니 된다. 다만, 지표(地表) 아래 부분은 그러하지 아니하다.\n도로면으로부터 높이 4.5미터 이하에 있는 출입구, 창문, 그 밖에 이와 유사한 구조물은 열고 닫을 때 건축선의 수직면을 넘지 아니하는 구조로 하여야 한다.","hang_ids":["건축법(법률)::제4장::제47조::1","건축법(법률)::제4장::제47조::2"],"text_status":"found"}],"reason":"도로 너비가 4m 미만이거나 지정 건축선이 있으면 도로경계선에서 물러난 선이 건축선이 돼요","status":"conditional","basis":"도로경계선 후퇴 (조례에 따름)","value":null},{"id":"adjacent","group":"road_setback","title":"대지 안의 공지·인접대지 이격","refs":[{"instrument":"민법","kind":"act","article":"제242조","clause":null,"text":null,"hang_ids":[],"text_status":"needs_source","text_gap":"법령 그래프 검색에 이 조문이 없어요"},{"instrument":"건축법","kind":"act","article":"제58조","clause":null,"text":"건축물을 건축하는 경우에는 「국토의 계획 및 이용에 관한 법률」에 따른 용도지역ㆍ용도지구, 건축물의 용도 및 규모 등에 따라 건축선 및 인접 대지경계선으로부터 6미터 이내의 범위에서 대통령령으로 정하는 바에 따라 해당 지방자치단체의 조례로 정하는 거리 이상을 띄워야 한다.","hang_ids":["건축법(법률)::제6장::제58조::본문"],"text_status":"found"},{"instrument":"건축법 시행령","kind":"decree","article":"제80조의2","clause":null,"text":null,"hang_ids":[],"text_status":"needs_source","text_gap":"법령 그래프 검색에 이 조문이 없어요"},{"instrument":"건축조례","kind":"ordinance","article":null,"clause":null,"text":null,"hang_ids":[],"text_status":"needs_source","text_gap":"조례 원문은 law.go.kr에서 Law Agent가 조문별로 가져와요"}],"reason":"인접대지 경계에서 띄우는 거리가 민법과 조례(용도·규모별)로 정해져요","status":"applies","basis":"최소 0.5 m (조례 별표로 상향 가능)","value":null},{"id":"parking","group":"parking_landscape","title":"부설주차장 설치기준","refs":[{"instrument":"주차장법","kind":"act","article":"제19조","clause":null,"text":"「국토의 계획 및 이용에 관한 법률」에 따른 도시지역, 같은 법 제51조제3항에 따른 지구단위계획구역 및 지방자치단체의 조례로 정하는 관리지역에서 건축물, 골프연습장, 그 밖에 주차수요를 유발하는 시설(이하 \"시설물\"이라 한다)을 건축하거나 설치하려는 자는 그 시설물의 내부 또는 그 부지에 부설주차장(화물의 하역과 그 밖의 사업 수행을 위한 주차장을 포함한다. 이하 같다)을 설치하여야 한다.\n특별시장ㆍ광역시장ㆍ특별자치시장ㆍ특별자치도지사 또는 시장은 부설주차장을 설치하면 교통 혼잡이 가중될 우려가 있는 지역에 대하여는 제1항 및 제3항에도 불구하고 부설주차장의 설치를 제한할 수 있다. 이 경우 제한지역의 지정 및 설치 제한의 기준은 국토교통부령으로 정하는 바에 따라 해당 지방자치단체의 조례로 정한다.\n시장ㆍ군수 또는 구청장은 제13항에 따라 지정된 개방주차장의 위치, 개방시간 및 주차요금 등 국토교통부령으로 정하는 사항을 인터넷 홈페이지에 게재하는 등의 방법으로 홍보하여야 한다.\n시장ㆍ군수 또는 구청장은 설치기준에 적합한 부설주차장이 제3항에 따른 부설주차장 설치기준의 개정으로 인하여 설치기준에 미달하게 된 기존 시설물 중 대통령령으로 정하는 시설물에 대하여는 그 소유자에게 개정된 설치기준에 맞게 부설주차장을 설치하도록 권고할 수 있다.\n시장ㆍ군수 또는 구청장은 제11항에 따라 부설주차장의 설치권고를 받은 자가 부설주차장을 설치하려는 경우 제21조의2제6항에 따라 부설주차장의 설치비용을 우선적으로 보조할 수 있다.","hang_ids":["주차장법(법률)::제5장::제19조::1","주차장법(법률)::제5장::제19조::10","주차장법(법률)::제5장::제19조::15","주차장법(법률)::제5장::제19조::11","주차장법(법률)::제5장::제19조::12"],"text_status":"found"},{"instrument":"주차장법 시행령","kind":"decree","article":"제6조","clause":null,"text":"법 제19조제3항에 따라 부설주차장을 설치하여야 할 시설물의 종류와 부설주차장의 설치기준은 별표 1과 같다. 다만, 다음 각 호의 경우에는 특별시ㆍ광역시ㆍ특별자치도ㆍ시 또는 군(광역시의 군은 제외한다. 이하 이 조에서 같다)의 조례로 시설물의 종류를 세분하거나 부설주차장의 설치기준을 따로 정할 수 있다.\n건축물의 용도를 변경하는 경우에는 용도변경 시점의 주차장 설치기준에 따라 변경 후 용도의 주차대수와 변경 전 용도의 주차대수를 산정하여 그 차이에 해당하는 부설주차장을 추가로 확보하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 부설주차장을 추가로 확보하지 아니하고 건축물의 용도를 변경할 수 있다.\n특별시ㆍ광역시ㆍ특별자치도ㆍ시 또는 군은 주차수요의 특성 또는 증감에 효율적으로 대처하기 위하여 필요하다고 인정하는 경우에는 별표 1의 부설주차장 설치기준의 2분의 1의 범위에서 그 설치기준을 해당 지방자치단체의 조례로 강화하거나 완화할 수 있다. 이 경우 별표 1의 시설물의 종류ㆍ규모를 세분하여 각 시설물의 종류ㆍ규모별로 강화 또는 완화의 정도를 다르게 정할 수 있다.\n제1항 단서 및 제2항에 따라 부설주차장의 설치기준을 조례로 정하는 경우 해당 지방자치단체는 해당 지역의 구역별로 부설주차장 설치기준을 각각 다르게 정할 수 있다.","hang_ids":["주차장법(시행령)::제6조::1","주차장법(시행령)::제6조 district","title":"공공주택지구","refs":[{"instrument":"공공주택 특별법","kind":"act","article":"제6조","clause":null,"text":"국토교통부장관은 공공주택지구조성사업(이하 \"지구조성사업\"이라 한다)을 추진하기 위하여 필요한 지역을 공공주택지구(이하 \"주택지구\"라 한다)로 지정하거나 지정된 주택지구를 변경 또는 해제할 수 있다.\n제3항에 따라 중앙도시계획위원회가 심의를 하는 경우에는 60일 이내에 심의를 완료하여야 하며 같은 기간 내에 심의를 완료하지 아니한 경우에는 심의한 것으로 본다.\n제4조에 따른 공공주택사업자는 국토교통부장관에게 주택지구의 지정을 제안할 수 있으며, 다음 각 호의 어느 하나에 해당하는 경우 주택지구의 변경 또는 해제를 제안할 수 있다.\n제2항에 따른 지정ㆍ변경 또는 해제의 제안에 필요한 사항은 대통령령으로 정한다.\n국토교통부장관은 주택지구를 지정하거나 지정된 주택지구를 변경하려면 「국토의 계획 및 이용에 관한 법률」 제106조에 따른 중앙도시계획위원회의 심의를 거쳐야 하며, 이 경우 같은 법 제8조 및 제9조는 적용하지 아니한다. 다만, 대통령령으로 정하는 경미한 사항을 변경하는 경우에는 그러하지 아니하다.\n국토교통부장관이 제1항에 따라 주택지구를 지정ㆍ변경ㆍ해제하거나 공공주택사업자가 제2항에 따라 주택지구의 지정ㆍ변경ㆍ해제를 제안하려는 경우, 국토교통부장관 및 공공주택사업자는 해당 지역의 주택수요, 지역여건 등을 종합적으로 검토하여야 한다. 이 경우 국토교통부장관 및 공공주택사업자는 주택지구의 지정ㆍ변경ㆍ해제 및 그 제안에 대하여 관계 중앙행정기관의 장, 관할 지방자치단체의 장, 지방공사 등 관계기관과 사전 협의할 수 있다.","hang_ids":["공공주택 특별법(법률)::제2장::제6조::1","공공주택 특별법(법률)::제2장::제6조::4","공공주택 특별법(법률)::제2장::제6조::2","공공주택 특별법(법률)::제2장::제6조::6","공공주택 특별법(법률)::제2장::제6조::3","공공주택 특별법(법률)::제2장::제6조::5"],"text_status":"found"},{"instrument":"공공주택 특별법","kind":"act","article":"제17조","clause":null,"text":"공공주택사업자는 다음 각 호의 사항을 포함한 공공주택지구계획을 수립하여 국토교통부장관의 승인을 받아야 한다. 승인된 지구계획을 변경하는 때에도 같다. 다만, 제7조제1항에 따라 주거지역 안에서 주택지구를 지정ㆍ변경하는 경우와 대통령령으로 정하는 경미한 사항을 변경하는 경우에는 그러하지 아니하다.\n제3항에 따라 관계 서류의 사본을 송부받은 시장ㆍ군수 또는 구청장은 이를 일반인이 열람할 수 있도록 하여야 한다.\n국토교통부장관은 제1항에 따라 지구계획을 승인한 때에는 대통령령으로 정하는 바에 따라 고시하고, 관계 서류의 사본을 관계 시장ㆍ군수 또는 구청장에게 송부하여야 한다.\n국토교통부장관은 제1항에 따라 지구계획을 승인하려면 제33조에 따른 공공주택통합심의위원회의 심의를 거쳐야 한다. 다만, 지구계획의 변경(제34조제3항제2호부터 제7호까지의 어느 하나에 해당하는 위원회의 검토나 심의를 거쳐야 하는 변경은 제외한다)이나 공공주택사업자가 요청한 경우 등 대통령령으로 정하는 경우에는 그러하지 아니하다.\n제3항에 따라 관계 서류의 사본을 송부받은 시장ㆍ군수 또는 구청장은 관계 서류에 도시ㆍ군관리계획결정사항이 포함되어 있는 경우에는「국토의 계획 및 이용에 관한 법률」 제32조 및 「토지이용규제 기본법」 제8조에 따라 지형도면 작성에 필요한 조치를 하여야 한다. 이 경우 공공주택사업자는 지형도면 고시에 필요한 서류를 시장ㆍ군수 또는 구청장에게 제출하여야 한다.","hang_ids":["공공주택 특별법(법률)::제3장::제17조::1","공공주택 특별법(법률)::제3장::제17조::4","공공주택 특별법(법률)::제3장::제17조::3","공공주택 특별법(법률)::제3장::제17조::2","공공주택 function nav(){const q=$('search').value.trim();$('nav').replaceChildren();for(const group of DATA.review.groups){const items=DATA.review.items.filter(x=>x.group===group.id&&JSON.stringify(x).includes(q));if(!items.length)continue;const h=document.createElement('h2');h.textContent=group.label;$('nav').append(h);for(const item of items){const b=document.createElement('button');b.className='nav-item'+(item===selected?' active':'');b.textContent=item.title;const s=document.createElement('span');s.textContent=labels[item.status];b.append(s);b.onclick=()=>{selected=item;render()};$('nav').append(b)}}}
function source(ref){$('sources').replaceChildren();for(const r of selected.refs){const b=document.createElement('button');b.className=r===ref?'active':'';b.textContent=kinds[r.kind]+' · '+(r.article||'조문 확인 필요');b.onclick=()=>source(r);$('sources').append(b)}$('meta').textContent=['기준일 '+DATA.review.assessment_date,ref.edition_id?'판본 '+ref.edition_id:'',ref.effective_date?'시행 '+ref.effective_date:''].filter(Boolean).join('　·　');$('articleTitle').textContent=[ref.instrument,ref.article,ref.clause].filter(Boolean).join(' ');$('kind').textContent=kinds[ref.kind]+' 원문';$('body').replaceChildren();if(ref.text){const text=ref.text.replace(/\s*([①-⑳])/gu,'\n\n$1').replace(/(?<![\d.])(?=\d{1,2}\.\s*[가-힣])/gu,'\n\n');for(const part of text.split(/\n\s*\n/).filter(x=>x.trim())){const p=document.createElement('p');p.textContent=part.trim();if(/^(\d+\.|[①-⑳])/.test(part.trim()))p.className='numbered';$('body').append(p)}}else{const p=document.createElement('p');p.className='empty';p.textContent=ref.text_gap||'저장된 결과에 원문이 없습니다. 실제 화면에서 원문 조회를 실행해 주세요.';$('body').append(p)}$('official').hidden=!ref.url;if(ref.url)$('official').href=ref.url}
function render(){nav();$('crumb').textContent=(DATA.review.groups.find(x=>x.id===selected.group)?.label||'검토 조항')+' / '+selected.title;$('title').textContent=selected.title;$('status').textContent=labels[selected.status];$('value').textContent=selected.value||'';$('reason').textContent=selected.reason;$('basis').textContent=selected.basis||'판단 근거 확인 필요';if(selected.refs.length)source(selected.refs.find(x=>x.kind==='ordinance'&&x.text)||selected.refs[0]);else{$('body').textContent='근거 조문 확인 필요'}}
$('search').oninput=nav;$('width').onclick=()=>{document.body.classList.toggle('compact');$('width').textContent=document.body.classList.contains('compact')?'넓게 보기':'좁은 패널 보기'};function resize(n){size=Math.max(11,Math.min(18,size+n));$('document').style.setProperty('--body-size',size+'px');$('size').textContent=size}$('minus').onclick=()=>resize(-1);$('plus').onclick=()=>resize(1);$('ask').onclick=()=>location.href='/dwg?artifact=law&tab=review&pnu='+encodeURIComponent(DATA.pnu);render();
</script></body></html>
