[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plan"
version = "0.1.0"
description = "Mass-conditioned program-aware floor plan research scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "jsonschema>=4.23,<5",
    "openai>=2.11,<3",
    "pillow>=12.1,<13",
    "pyproj>=3.7,<4",
    "shapely>=2.1,<3",
    "uvicorn>=0.34,<1",
    "pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app.modules.regulations" = ["data/*.json", "data/ordinance_overrides/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
