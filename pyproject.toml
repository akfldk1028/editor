[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plan"
version = "0.1.0"
description = "Mass-conditioned program-aware floor plan research scaffold"
requires-python = ">=3.11"
dependencies = [
    "autogen-agentchat==0.7.5",
    "autogen-ext[openai,anthropic,ollama]==0.7.5",
    "mcp==1.27.0",
    "django>=5.2,<7",
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "google-genai>=1,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "manifold3d>=3.4,<4",
    "neo4j>=5.14,<6",
    "networkx>=3,<4",
    "numpy>=2,<3",
    "openai>=2.11,<3",
    "pillow>=12.1,<13",
    "pyproj>=3.7,<4",
    "pymoo>=0.6,<0.7",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "scipy>=1.14,<2",
    "shapely>=2.1,<3",
    "uvicorn>=0.34,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
terrain = ["rasterio>=1.4,<2"]
design-reference-models = ["torch>=2.5", "torchvision>=0.20", "opencv-python>=4.10,<5"]
dev = ["import-linter>=2.15,<3"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app.modules.regulations" = ["data/*.json", "data/ordinance_overrides/*.json"]
"backend.app.modules.design.generation" = ["*.json", "**/*.json", "**/*.yaml", "**/*.yml", "**/*.md", "**/*.csv"]
"backend.app.modules.land.reference" = ["data/*.json", "data/ordinance_overrides/*.json"]
"backend.app.modules.law.reference" = ["data/structured/*.json", "data/facility_sources/*.json", "data/use_research_sources.json", "*-manifest.json"]
"backend.app.contracts" = ["planm/*.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

# Layer contract (import-linter; checked by backend/tests/test_import_layers.py).
# Higher layers may import lower ones, never the reverse. Existing exceptions are
# listed with their reason and are technical debt to burn down, not a pattern.
[tool.importlinter]
root_package = "backend"

[[tool.importlinter.contracts]]
name = "Editor app layers (top imports down only)"
type = "layers"
layers = [
    "backend.app.route_inventory",
    "backend.app.main | backend.app.cli",
    "backend.app.api",
    "backend.app.modules",
    "backend.app.adapters",
    "backend.app.core | backend.app.schemas | backend.app.contracts",
]
ignore_imports = [
    # Agent code imports this bootstrap by path (agents/** is read-only), so it cannot move yet.
    "backend.app.adapters.design_storage.bootstrap -> backend.app.modules.design.generation.paths",
    # Tool provider strings for this module are stored in the workspace catalog DB.
    "backend.app.adapters.workspace.tools -> backend.app.modules.land.services",
]
