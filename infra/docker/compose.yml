services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      PLANM_REPOSITORY_ROOT: /app
      PLANM_RUNS_ROOT: /data/planm-runs
      # The URL handed back after publishing. Relative, so it resolves against
      # whatever origin the shell is served from.
      PASCAL_EDITOR_URL: /editor
      # PASCAL_MCP_URL is deliberately unset: this stack has no MCP HTTP
      # service, so POST .../pascal answers 503 explaining that rather than
      # failing obscurely. Run `bun run plan:dev` for the wired-up bridge, or
      # point this at an MCP server you host yourself.
    volumes:
      - planm-runs:/data/planm-runs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)); assert data['info']['title'] == 'PLANM API'"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  dwg:
    build:
      context: ../..
      dockerfile: infra/docker/dwg.Dockerfile
    volumes:
      - planm-runs:/data/planm-runs
      - dwg-exports:/data/dwg-exports
    expose:
      - "4317"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/api/health').then(async response => { const body = await response.json(); if (!response.ok || body.ok !== true || body.service !== 'dwg-provider-gateway') process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  # The Pascal 3D editor, served as one surface of the shell at /editor. It
  # runs with PASCAL_BASE_PATH so Next knows it is mounted under that path
  # rather than at the root.
  editor:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      NODE_ENV: production
      PASCAL_BASE_PATH: /editor
      PASCAL_DATA_DIR: /data
    volumes:
      - pascal-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:3000/editor/api/health",
        ]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      dwg:
        condition: service_healthy
      editor:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  planm-runs:
  dwg-exports:
  pascal-data:
